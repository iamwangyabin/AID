arch: "D3Model"
test_name: "d3_test_many"

eval_pipeline: utils.validate_plain

resume:
  path: "./logs/your_d3_run/last.ckpt"
  target: utils.resume_tools.resume_lightning
  # For the official D3 ckpt/classifier.pth attention-head file, use:
  # target: utils.resume_tools.resume_d3_attention_head

model:
  name: "ViT-L/14"
  num_classes: 1
  shuffle_times: 1
  original_times: 1
  patch_size: 14
  freeze_backbone: true

datasets:
  base_path: "/path/to/DF-arrow-data"
  source:
    # Test-on-many: each sub_set is evaluated separately by test.py.
    - { target: data.ArrowDatasets,
        data_root: '${datasets.base_path}/ForenSynths',
        sub_sets: [ "biggan", "crn", "cyclegan", "deepfake", "gaugan", "imle", "progan", "san",
                    "seeingdark", "stargan", "stylegan", "stylegan2", "whichfaceisreal" ],
        split: 'test',
        benchmark_name: 'ForenSynths' }

    - { target: data.ArrowDatasets,
        data_root: '${datasets.base_path}/DIF',
        sub_sets: [ 'dalle_2', 'dalle_mini', 'glide', 'mj', 'sd14', 'sd21' ],
        split: 'test',
        benchmark_name: 'DIF' }

  batch_size: 64
  loader_workers: 8
  trsf:
    - _target_: torchvision.transforms.Resize
      size: 256
    - _target_: torchvision.transforms.CenterCrop
      size: 224
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean: [0.48145466, 0.4578275, 0.40821073]
      std: [0.26862954, 0.26130258, 0.27577711]
