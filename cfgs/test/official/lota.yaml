arch: "LOTAModel"
test_name: "LOTA"

model:
  pretrained: false
  num_classes: 1

eval_pipeline: utils.validate_plain
resume:
  path: null
  target: utils.resume_tools.no_resume

datasets:
  base_path: "/home/yabin/DataDrive/DF-arrow-data"
  source:
    - { target: data.ArrowDatasets,
        data_root: '${datasets.base_path}/DIF',
        sub_sets: [ 'dalle_2',  'dalle_mini',  'glide',  'mj',  'sd14',  'sd21' ],
        split: 'test',
        benchmark_name: 'DIF'}

  batch_size: 64
  loader_workers: 16
  trsf:
    - _target_: data.LOTABitPatch
      img_height: 256
      bit_mode: "thresholding"
      patch_size: 32
      patch_mode: "max"
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
