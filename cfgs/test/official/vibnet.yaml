arch: "VIBNet"
test_name: "VIBNet"

model:
  name: "ViT-L/14"
  bottleneck_dim: 256
  hidden_dim: 1024
  dropout: 0.5
  freeze_clip: True
  sample_latent: True
  use_mean_on_eval: False

eval_pipeline: utils.validate_plain

resume:
  path: "logs/vibnet_progan/last.ckpt"
  target: utils.resume_tools.resume_vibnet

datasets:
  base_path: "/data/yabin/DF-arrow-data"
  source:
    - { target: data.ArrowDatasets,
        data_root: '${datasets.base_path}/DIF',
        sub_sets: [ 'dalle_2', 'dalle_mini', 'glide', 'mj', 'sd14', 'sd21' ],
        split: 'test',
        benchmark_name: 'DIF' }

  batch_size: 128
  loader_workers: 16
  trsf:
    - _target_: torchvision.transforms.CenterCrop
      size: 224
    - _target_: torchvision.transforms.ToTensor
    - _target_: torchvision.transforms.Normalize
      mean: [0.48145466, 0.4578275, 0.40821073]
      std: [0.26862954, 0.26130258, 0.27577711]
