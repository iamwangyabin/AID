arch: "CLIDEModel"
test_name: "CLIDE_global_general"

eval_pipeline: utils.validate_plain

resume:
  path: null
  target: utils.resume_tools.no_resume

model:
  name: "ViT-L/14"
  mode: "global"
  # Official CLIDE precomputed global whitening stats. Download with:
  #   python tools/download_clide_official_stats.py --domain general --kind global
  w_mat_path: "./networks/weights/clide/whitening_matrix_general.pt"

  # AID labels use 1 for fake. Official CLIDE likelihood is higher for images
  # close to the real representative distribution, so default score is -likelihood.
  score_sign: -1.0
  threshold: 0.0
  temperature: 1000.0

  image_size: 224
  resize_shorter_edge: 224
  interpolation: "bicubic"

datasets:
  # NOTE: change this to your local dataset root, or override from CLI:
  #   python test.py --cfg cfgs/test/official/clide_global.yaml datasets.base_path=/path/to/DF-arrow
  base_path: "/path/to/DF-arrow-data"
  source:
    - { target: data.ArrowDatasets,
        data_root: '${datasets.base_path}/ForenSynths',
        sub_sets: [ "biggan", "crn", "cyclegan", "deepfake", "gaugan", "imle", "progan", "san",
                    "seeingdark", "stargan", "stylegan", "stylegan2", "whichfaceisreal" ],
        split: 'test',
        benchmark_name: 'ForenSynths' }

    - { target: data.ArrowDatasets,
        data_root: '${datasets.base_path}/DIF',
        sub_sets: [ 'dalle_2', 'dalle_mini', 'glide', 'mj', 'sd14', 'sd21' ],
        split: 'test',
        benchmark_name: 'DIF' }

  batch_size: 64
  loader_workers: 8
  trsf:
    - _target_: torchvision.transforms.Resize
      size: 224
      antialias: true
    - _target_: torchvision.transforms.CenterCrop
      size: 224
    - _target_: torchvision.transforms.ToTensor
