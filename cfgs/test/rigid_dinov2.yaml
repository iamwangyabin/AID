arch: "RIGIDModel"
test_name: "RIGID_DINOv2_zero_shot"

eval_pipeline: utils.validate_plain

resume:
  path: null
  target: utils.resume_tools.no_resume

model:
  model_name: "facebook/dinov2-base"
  noise_level: 0.02
  threshold: 0.02
  temperature: 0.01
  num_noise_samples: 1

  resize_shorter_edge: 256
  crop_size: 224
  interpolation: "bicubic"

datasets:
  # NOTE: change this to your local dataset root
  base_path: "/home/data/yabin/DF-arrow"
  source:
    - { target: data.ArrowDatasets,
        data_root: '${datasets.base_path}/DIF',
        sub_sets: [ 'dalle_2',  'dalle_mini',  'glide',  'mj',  'sd14',  'sd21', ],
        split: 'test',
        benchmark_name: 'DIF'}

  batch_size: 32
  loader_workers: 8

  trsf:
    - _target_: torchvision.transforms.Resize
      size: 256
    - _target_: torchvision.transforms.CenterCrop
      size: 224
    - _target_: torchvision.transforms.ToTensor