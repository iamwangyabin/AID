# Not that, this training is only slightly different from original GramNet:
# original: LogSoftmax+NLLLoss ; this: Sigmoid + Binary Cross entropy
# original: Adam ; this: Adamw

arch: "Gram"
name: "Gram_progan"

train:
  pipeline: engine.base_trainer

  gpu_ids: [1]
  train_epochs: 10
  check_val_every_n_epoch: 1
  seed: 1995
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: True
    lr: 0.00001
    weight_decay: 1e-3
    betas: [0.9, 0.999]

  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: True
    T_max: ${train.train_epochs}

datasets:
#  base_path: "/scratch/yw26g23/datasets/df-arrow/"
  base_path: "/home/jwang/ybwork/data/DF-arrow"

  train:
    source:
#      - { target: data.ArrowDatasets,
#          data_root: '${datasets.base_path}/ForenSynths',
#          sub_sets: [ "airplane", "bird", "bottle", "car", "chair", "diningtable", "horse", "person", "sheep", "train",
#                      "bicycle", "boat", "bus", "cat", "cow", "dog", "motorbike", "pottedplant", "sofa", "tvmonitor" ],
#          split: 'train_binary' }

      - { target: data.ArrowDatasets,
          data_root: '${datasets.base_path}/ForenSynths',
          sub_sets: [ "car", "chair", "horse",  "cat", ],
          split: 'train_binary' }

    batch_size: 256
    loader_workers: 32
    trsf:
#      - _target_: torchvision.transforms.Resize
#        size: 256
#      - _target_: torchvision.transforms.RandomResizedCrop
#        size: 224
#      - _target_: torchvision.transforms.RandomHorizontalFlip
#      - _target_: data.DataAugment
#        blur_prob: 0.5
#        blur_sig: [ 0.0, 3.0 ]
#        jpg_prob: 0.5
#        jpg_method: [ 'cv2', 'pil' ]
#        jpg_qual: [ 30, 100 ]
      - _target_: torchvision.transforms.ToTensor
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]

  val:
    source:
#      - { target: data.ArrowDatasets,
#          data_root: '${datasets.base_path}/ForenSynths',
#          sub_sets: [ "airplane", "bird", "bottle", "car", "chair", "diningtable", "horse", "person", "sheep", "train",
#                      "bicycle", "boat", "bus", "cat", "cow", "dog", "motorbike", "pottedplant", "sofa", "tvmonitor" ],
#          split: 'val' }

      - { target: data.ArrowDatasets,
          data_root: '${datasets.base_path}/DIF',
          sub_sets: [ 'dalle_2',  'dalle_mini',  'glide',  'mj',  'sd14',  'sd21', ],
          split: 'test',
          benchmark_name: 'DIF' }

    batch_size: 128
    loader_workers: 32
    trsf:
      - _target_: torchvision.transforms.Resize
        size: 256
      - _target_: torchvision.transforms.RandomResizedCrop
        size: 224
      - _target_: torchvision.transforms.ToTensor
      - _target_: torchvision.transforms.Normalize
        mean: [0.485, 0.456, 0.406]
        std: [0.229, 0.224, 0.225]



