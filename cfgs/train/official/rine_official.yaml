# Same data augmentation and hyperparameters (best results) used in the paper
# only except learning reate scheduler, it seems that in the original repo they have many epoch settings and use step lr scheduler
# however, the best parameter use 1 epoch, so there is no difference using CosineAnnealingLr or StepLr;
arch: "rine"
name: "rine_progan"

model:
  backbone0: "ViT-L/14"
  backbone1: 1024
  nproj: 2
  proj_dim: 1024

train:
  pipeline: engine.rine_trainer
  factor: 0.2
  gpu_ids: [0]
  train_epochs: 1
  check_val_every_n_epoch: 1
  seed: 1995
  optimizer:
    _target_: torch.optim.Adam
    _partial_: True
    lr: 1e-3
    weight_decay: 1e-3
    betas: [0.9, 0.999]

  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: True
    T_max: ${train.train_epochs}


datasets:
  base_path: "/home/jwang/ybwork/data/DFBenchmark/"
  train:
    source:
      - { target: data.ArrowDatasets,
          data_root: '${datasets.base_path}/ForenSynths',
          sub_sets: [ "car", "chair", "horse",  "cat", ],
          split: 'train_binary' }

    batch_size: 128
    loader_workers: 32
    trsf:
      - _target_: data.DataAugment
        blur_prob: 0.5
        blur_sig: [ 0.0, 3.0 ]
        jpg_prob: 0.5
        jpg_method: [ 'cv2', 'pil' ]
        jpg_qual: [ 30, 100 ]
      - _target_: torchvision.transforms.RandomCrop
        size: 224
      - _target_: torchvision.transforms.RandomHorizontalFlip
        p: 0.5
      - _target_: torchvision.transforms.ToTensor
      - _target_: torchvision.transforms.Normalize
        mean: [ 0.48145466, 0.4578275, 0.40821073 ]
        std: [ 0.26862954, 0.26130258, 0.27577711 ]

  val:
    source:
      - { target: data.ArrowDatasets,
          data_root: '${datasets.base_path}/DIF',
          sub_sets: [ 'dalle_2',  'dalle_mini',  'glide',  'mj',  'sd14',  'sd21'],
          split: 'test',
          benchmark_name: 'DIF' }

    batch_size: 128
    loader_workers: 32
    trsf:
      - _target_: data.RandomCompress
        method: "JPEG"
        qf: [70, 100]
      - _target_: torchvision.transforms.CenterCrop
        size: 224
      - _target_: torchvision.transforms.ToTensor
      - _target_: torchvision.transforms.Normalize
        mean: [0.48145466, 0.4578275, 0.40821073]
        std: [0.26862954, 0.26130258, 0.27577711]




