arch: "SPAIModel"
name: "SPAI_progan"

model:
  backbone_name: "vit_base_patch16_224"
  pretrained: true
  # Set this to the best checkpoint from cfgs/train/official/spai_mfm.yaml
  # to reproduce SPAI's real-image masked-frequency pretraining stage.
  mfm_checkpoint: null
  resolution_mode: "arbitrary"
  img_size: 224
  patch_stride: 224
  minimum_patches: 4
  feature_extraction_batch_size: 64
  masking_radius: 16
  projection_dim: 1024
  projection_layers: 2
  patch_projection: true
  patch_projection_per_feature: true
  projector_last_layer_activation_type: null
  original_image_features_branch: true
  disable_reconstruction_similarity: false
  attn_embed_dim: 512
  num_heads: 8
  cls_mlp_ratio: 3
  dropout: 0.5
  freeze_backbone: true
  input_is_normalized: false

train:
  pipeline: engine.base_trainer
  precision: 32
  gpu_ids: [0]
  train_epochs: 35
  check_val_every_n_epoch: 1
  seed: 1995
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: True
    lr: 0.0005
    betas: [0.9, 0.999]
    weight_decay: 0.05

  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    _partial_: True
    T_max: 35
    eta_min: 0.00000025

datasets:
  base_path: "/home/yabin/DataDrive/DF-arrow-data"
  train:
    source:
      - { target: data.ArrowDatasets,
          data_root: '${datasets.base_path}/ForenSynths',
          sub_sets: [ "airplane", "bird", "bottle", "car", "chair", "diningtable", "horse", "person", "sheep", "train",
                      "bicycle", "boat", "bus", "cat", "cow", "dog", "motorbike", "pottedplant", "sofa", "tvmonitor" ],
          split: 'train_binary' }

    batch_size: 32
    loader_workers: 16
    trsf:
      - _target_: torchvision.transforms.RandomCrop
        size: 224
      - _target_: torchvision.transforms.RandomHorizontalFlip
        p: 0.5
      - _target_: torchvision.transforms.ToTensor

  val:
    source:
      - { target: data.ArrowDatasets,
          data_root: '${datasets.base_path}/DIF',
          sub_sets: [ 'dalle_2',  'dalle_mini',  'glide',  'mj',  'sd14',  'sd21'],
          split: 'test',
          benchmark_name: 'DIF' }

    batch_size: 32
    loader_workers: 16
    trsf:
      - _target_: data.RandomCompress
        method: "JPEG"
        qf: [70, 100]
      - _target_: torchvision.transforms.CenterCrop
        size: 224
      - _target_: torchvision.transforms.ToTensor
