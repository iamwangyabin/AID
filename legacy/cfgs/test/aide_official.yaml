# Legacy/unsupported: AIDE is not registered in the current model factory.
arch: "aide"
test_name: "AIDE_official"

eval_pipeline: utils.validate_multicls

resume:
  path: './networks/weights/aide_progan_train.pth'
  target: utils.resume_tools.resume_cnndet

datasets:
  base_path: "/home/jwang/ybwork/data/DF-arrow"
  source:

    - { target: data.AIDEBinaryJsonDatasets,
        data_root: '/home/jwang/ybwork/data/DFBenchmark/AIGCDetect',
        sub_sets: ['wukong', 'Midjourney', 'stable_diffusion_v_1_5', 'ADM',  'Glide','stable_diffusion_v_1_4', 'VQDM'],
        split: 'test',
        benchmark_name: 'GenImage' }

  batch_size: 64
  loader_workers: 32

  trsf:
    - _target_: data.RandomCompress
      method: "JPEG"
      qf: [70, 100]
    - _target_: torchvision.transforms.ToTensor










